services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sgv_api
      # Superusuário: usado só pelo bootstrap do container. Nenhuma aplicação
      # se conecta com ele.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SGV_SENHA_POSTGRES:?defina no .env (veja .env.example)}
      # Senhas dos usuários da aplicação, consumidas por db/init/00-bootstrap.sh.
      SGV_SENHA_MIGRATOR: ${SGV_SENHA_MIGRATOR:?defina no .env}
      SGV_SENHA_API: ${SGV_SENHA_API:?defina no .env}
      SGV_SENHA_DEV: ${SGV_SENHA_DEV:?defina no .env}
    ports:
      - "5433:5432"
    volumes:
      - sgv_pgdata:/var/lib/postgresql/data
      # Só o bootstrap roda automaticamente; os .sql ficam ao lado, montados
      # somente-leitura, e são chamados por ele.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/sgv-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./sgv-api/
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/sgv_api
      # Usuário sem DDL: o schema vem de db/03-schema.sql, não do Hibernate.
      DATASOURCE_USERNAME: sgv_api
      DATASOURCE_PASSWORD: ${SGV_SENHA_API:?defina no .env}
      JPA_DDL_AUTO: validate
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://localhost:5173
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./sgv-web/
      args:
        VITE_PROD_API_BASEURL: http://localhost:8081
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sgv_pgdata:
