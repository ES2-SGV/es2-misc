services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sgv_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - sgv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./sgv-api/
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/sgv_api
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5174
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./sgv-web/
      args:
        VITE_API_BASEURL: http://localhost:8081
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sgv_pgdata:
